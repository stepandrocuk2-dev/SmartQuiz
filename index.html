<!DOCTYPE html>
<html lang="uk">
    <head><link rel="stylesheet" href="style.css"></head>
<body>

<div class="app-container">
    <div id="start-screen" class="screen">
        <h2>SmartQuiz</h2>
        <button id="start-btn">Почати</button>
    </div>
    <div id="quiz-screen" class="screen hide">
        <div class="headder">
            <span id="timer">Час: 15с</span>
            <span id="score-display">Бали: 0</span>
        </div>
        <h2 id="question-text">Запитання 1</h2>
        <div id="answer-container"></div>
    </div>
    <div id="result-screen" class="screen hide">
        <h2>Гру завершено!</h2>
        <p class="result-text"></p>
        <button id="restart-btn">Спробувати ще</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
